title: Caret Obfuscation in Windows Command Shell Command Line
id: c1d47b92-6ea3-4f18-8a05-9f2d3c7b6e84
status: experimental
description: >
  Detects caret (^) escape obfuscation in a cmd.exe command line. The cmd parser strips carets at
  runtime, so attackers interleave them through binary names and URLs to defeat literal string
  matching. Two or more caret-separated single characters is the signature.
references:
  - https://attack.mitre.org/techniques/T1027/010/
author: cbr-pnk
date: 2026-08-19
tags:
  - attack.defense-evasion
  - attack.t1027.010
  - attack.t1140
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\cmd.exe'
  obfuscation_re:
    CommandLine|re: '\^[A-Za-z0-9]\^[A-Za-z0-9]'
  obfuscation_known:
    CommandLine|contains:
      - 'm^s^h^t^a'
      - 'h^t^t^p'
      - 'p^o^w^e^r'
      - 'c^u^r^l'
      - 'c^e^r^t^u^t^i^l'
  condition: selection and (obfuscation_re or obfuscation_known)
falsepositives:
  - Batch scripts legitimately escaping pipes, ampersands or redirection characters. Those escape
    operators, not alphanumerics, so the regex above should not match them.
level: high

