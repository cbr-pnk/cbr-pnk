# Sigma rules for the ClickFix -> pcalua -> PowerShell -> cmd -> mshta chain
# See ../clickfix-pcalua-mshta.md for the full analysis.
# Test in audit/report-only mode before alerting; tune the pcalua rule first, it is the noisiest
# in estates that still run legacy installers.

title: Pcalua.exe Spawning a Script Interpreter
id: 8f3a1c40-5d21-4b9e-9c77-2b16e0a4d311
status: experimental
description: >
  Detects the Program Compatibility Assistant launcher (pcalua.exe) being used as an indirect
  execution proxy to start a script interpreter. Legitimate PCA use launches installers and
  legacy applications, not shells.
references:
  - https://lolbas-project.github.io/lolbas/Binaries/Pcalua/
  - https://attack.mitre.org/techniques/T1202/
author: cbr-pnk
date: 2026-08-19
tags:
  - attack.defense-evasion
  - attack.t1202
  - attack.execution
  - attack.t1059.001
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\pcalua.exe'
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\mshta.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  selection_cmdline:
    Image|endswith: '\pcalua.exe'
    CommandLine|contains:
      - 'powershell'
      - 'pwsh'
      - 'cmd'
      - 'mshta'
      - 'wscript'
      - 'cscript'
      - 'rundll32'
  condition: selection_parent or selection_cmdline
falsepositives:
  - Legacy application compatibility shims that legitimately wrap a batch or script launcher
level: high

