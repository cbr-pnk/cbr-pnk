title: Mshta.exe Executing Remote Content
id: 5b8e2f77-3c14-49a6-b0d3-71ea9c48f2ab
status: stable
description: >
  Detects mshta.exe invoked against a remote URL or an inline script protocol handler. Signed
  Microsoft binary used to retrieve and execute HTA/VBScript/JScript in memory.
references:
  - https://lolbas-project.github.io/lolbas/Binaries/Mshta/
  - https://attack.mitre.org/techniques/T1218/005/
author: cbr-pnk
date: 2026-08-19
tags:
  - attack.defense-evasion
  - attack.t1218.005
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\mshta.exe'
  remote:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'ftp://'
      - '\\\\'
  inline:
    CommandLine|contains:
      - 'javascript:'
      - 'vbscript:'
      - 'about:'
  condition: selection and (remote or inline)
falsepositives:
  - Legacy internal line-of-business web applications delivered as HTAs from an intranet host
level: high

