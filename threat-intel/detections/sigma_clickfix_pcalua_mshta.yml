title: Suspicious Command Written to Explorer RunMRU (ClickFix)
id: a2907e15-4b6c-4d80-95f1-6c3ab8d17e29
status: experimental
description: >
  Detects a script interpreter or download command being written to the Run dialog MRU key. The
  RunMRU value records verbatim whatever was typed or pasted into Win+R, making it the defining
  forensic artefact of ClickFix-style copy/paste social engineering.
references:
  - https://attack.mitre.org/techniques/T1204/004/
author: cbr-pnk
date: 2026-08-19
tags:
  - attack.execution
  - attack.t1204.004
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU\'
  suspicious:
    Details|contains:
      - 'powershell'
      - 'pwsh'
      - 'mshta'
      - 'pcalua'
      - 'rundll32'
      - 'regsvr32'
      - 'certutil'
      - 'bitsadmin'
      - 'curl '
      - 'msiexec'
      - 'wscript'
      - 'cscript'
      - 'FromBase64String'
      - '^'
      - 'http'
  condition: selection and suspicious
falsepositives:
  - Administrators and developers legitimately launching powershell or cmd from the Run dialog.
    Baseline per user; the strong signal is an interpreter plus a URL or obfuscation in one value.
level: high
